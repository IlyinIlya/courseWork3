databaseChangeLog:
  - changeSet:
      id: 1
      author: Dumbledore
      changes:
        - createTable:
            tableName: notification_task
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: chat_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: message
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: notification_time
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false